# Refreshes the permit history that the Overview, the Map and the Operators page read for Oklahoma, New Mexico and the federal offshore (the files
# site/public/data/{series-permits,county-permits,operators,permits}-{ok,nm,fo}.json), commits what changed and publishes the site.
# Once a week is enough: Oklahoma's files end on its newest approval day and its source is a 154 MB workbook, so a nightly
# download would be a lot to ask of a public server for little; New Mexico's and the offshore's end on the last month that ended two months ago, so
# they change when a month enters or a late spud date arrives (BSEE makes its borehole file once a week, on Sundays). The three refreshes are isolated from
# each other, and from the nightly captures (a separate workflow, run one at a time with them), so a failure here cannot touch the daily reports: a failed
# one's files are put back as committed, the others are still committed and published, and the run ends red after the publish.
# The EIA crude series are not refreshed here (they change once a month; see the NOTES files), nor is the offshore's map of 63 areas (counties-fo.geo.json: by hand, rarely).
name: Monthly files (Oklahoma OCC, New Mexico OCD and the federal offshore BSEE)

on:
  schedule:
    # Mondays 05:40 UTC: well after the nightly capture (03:15) and its backup (04:20), which are done by then
    - cron: "40 5 * * 1"
  workflow_dispatch:

# the same group as the nightly capture: the two never run at once, so their commits and their publishes cannot collide
concurrency:
  group: daily-rrc-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # three requests to the Division's well layer, about four seconds
      - name: Refresh New Mexico's permit history
        id: nm_refresh
        continue-on-error: true
        timeout-minutes: 8
        run: python3 -I site/pipeline/d9_nm_monthly.py

      # one 4 MB zip of boreholes and one 0.2 MB zip of companies from BSEE's Data Center, about ten seconds
      - name: Refresh the federal offshore's drilling history
        id: fo_refresh
        continue-on-error: true
        timeout-minutes: 6
        run: python3 -I site/pipeline/d10_fo_monthly.py

      # downloads the Commission's intent-to-drill master workbook (about 154 MB) and its daily file, and reads 400,000 rows
      - name: Refresh Oklahoma's permit history
        id: ok_refresh
        continue-on-error: true
        timeout-minutes: 25
        run: python3 -I site/pipeline/d8_ok_monthly.py

      - name: Check New Mexico's files
        id: nm_check
        continue-on-error: true
        run: python3 -I site/pipeline/d9_nm_monthly.py --check

      - name: Check Oklahoma's files
        id: ok_check
        continue-on-error: true
        run: python3 -I site/pipeline/d8_ok_monthly.py --check

      - name: Check the federal offshore's files
        id: fo_check
        continue-on-error: true
        run: python3 -I site/pipeline/d10_fo_monthly.py --check

      # a failed refresh or a failed check must not put data on main: put that state's four files back as they were committed
      - name: Drop the New Mexico files if the refresh or its check failed
        if: ${{ steps.nm_refresh.outcome == 'failure' || steps.nm_check.outcome == 'failure' }}
        run: |
          echo "::warning title=New Mexico files::the refresh or its check failed; the files are left as committed. The others go ahead."
          git checkout -- site/public/data/series-permits-nm.json site/public/data/county-permits-nm.json site/public/data/operators-nm.json site/public/data/permits-nm.json

      - name: Drop the Oklahoma files if the refresh or its check failed
        if: ${{ steps.ok_refresh.outcome == 'failure' || steps.ok_check.outcome == 'failure' }}
        run: |
          echo "::warning title=Oklahoma files::the refresh or its check failed; the files are left as committed. The others go ahead."
          git checkout -- site/public/data/series-permits-ok.json site/public/data/county-permits-ok.json site/public/data/operators-ok.json site/public/data/permits-ok.json

      - name: Drop the federal offshore files if the refresh or its check failed
        if: ${{ steps.fo_refresh.outcome == 'failure' || steps.fo_check.outcome == 'failure' }}
        run: |
          echo "::warning title=Federal offshore files::the refresh or its check failed; the files are left as committed. The others go ahead."
          git checkout -- site/public/data/series-permits-fo.json site/public/data/county-permits-fo.json site/public/data/operators-fo.json site/public/data/permits-fo.json

      # the National report's one file (national.json) is built from those twelve files: rebuild it from what is about to be committed, so the report never lags a refresh.
      # The builder validates before it writes, so a failed rebuild leaves national.json as committed and only shows as a red run.
      - name: Rebuild the national report's file
        id: nat_build
        continue-on-error: true
        run: python3 -I site/pipeline/d11_nat_build.py

      - name: Commit the new files
        run: |
          git config user.name "refresh-monthly"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data/series-permits-nm.json site/public/data/county-permits-nm.json site/public/data/operators-nm.json site/public/data/permits-nm.json \
                  site/public/data/series-permits-ok.json site/public/data/county-permits-ok.json site/public/data/operators-ok.json site/public/data/permits-ok.json \
                  site/public/data/series-permits-fo.json site/public/data/county-permits-fo.json site/public/data/operators-fo.json site/public/data/permits-fo.json \
                  site/public/data/national.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Monthly Oklahoma, New Mexico and federal offshore files $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # a commit made with the workflow's own token starts neither CI nor the publish after a merge, so this publishes itself
      - name: Publish the site to GitHub Pages
        run: bash .github/scripts/publish_pages.sh

      - name: Fail the run if a refresh or a check failed
        if: ${{ !cancelled() && (steps.nm_refresh.outcome == 'failure' || steps.nm_check.outcome == 'failure' || steps.ok_refresh.outcome == 'failure' || steps.ok_check.outcome == 'failure' || steps.fo_refresh.outcome == 'failure' || steps.fo_check.outcome == 'failure' || steps.nat_build.outcome == 'failure') }}
        run: |
          echo "::error title=Monthly files::New Mexico refresh ${{ steps.nm_refresh.outcome }}, New Mexico check ${{ steps.nm_check.outcome }}, Oklahoma refresh ${{ steps.ok_refresh.outcome }}, Oklahoma check ${{ steps.ok_check.outcome }}, federal offshore refresh ${{ steps.fo_refresh.outcome }}, federal offshore check ${{ steps.fo_check.outcome }}, national report file ${{ steps.nat_build.outcome }}. What succeeded was committed and published; what failed was left as committed."
          exit 1
