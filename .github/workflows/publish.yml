# Publishes the site to GitHub Pages (the gh-pages branch) after a push to main that CI passed, so a merged change reaches visitors
# without a capture run and without touching the Railroad Commission or the OCC. The nightly capture publishes by itself after it
# commits its data (that commit is pushed with the workflow's own token, which starts no other workflow, so it neither runs CI nor
# this). If the two publish at the same moment, both retry (.github/scripts/publish_pages.sh). When main has moved on since the commit CI
# passed (the nightly's data commit, another merge), this publish steps aside: the newer commit's publish includes this one, and this one
# would put an older tree over it. Run by hand (Actions, Publish the site) to publish main as it is now.
name: Publish the site

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # a workflow_run starts whatever CI concluded: publish only a green push to main (a manual run always goes ahead)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the commit CI passed, or main as it is now for a manual run
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      # a newer commit on main (the nightly capture's data, a weekly refresh or another merge) comes with a publish of its own that already
      # includes this commit, so publishing this older one now would put an older tree over it until the next publish
      - name: Skip when main has moved on
        id: tip
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          # if main's tip cannot be read, go ahead and publish (the old behavior): a guard must not be the thing that stops a publish
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$tip" ] && [ "$tip" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::notice title=Publish skipped::main has moved on from ${{ github.event.workflow_run.head_sha }}; the publish that goes with its newer commit carries this change"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the site to GitHub Pages
        if: ${{ steps.tip.outputs.skip != 'true' }}
        run: |
          git config user.name "publish-site"
          git config user.email "actions@users.noreply.github.com"
          bash .github/scripts/publish_pages.sh
