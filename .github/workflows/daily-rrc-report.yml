# Captures the Railroad Commission of Texas's nightly files into site/public/data/daily/, the Oklahoma Corporation
# Commission's daily files into site/public/data/daily-ok/ and New Mexico's permits to drill (from the Oil Conservation
# Division's well layer) into site/public/data/daily-nm/, commits the result, then publishes the site to GitHub Pages (the
# gh-pages branch). It runs from the default branch only. The three captures are isolated from each other: if one fails (the RRC
# refusing GitHub's runners, an OCC or OCD hiccup), the others are still captured, committed and published, the failed one's
# changes are dropped before the commit, and the run ends red after the publish so the failure is seen.
name: Daily reports (Texas RRC, Oklahoma OCC and New Mexico OCD)

on:
  schedule:
    # 03:15 UTC = 10:15 PM CDT / 9:15 PM CST: after the last file the RRC posts that day (the 11 AM pending set is on the
    # share by about 6 PM Central), and still the same Central-time day
    - cron: "15 3 * * *"
    # a backup for a trigger GitHub skips (it can delay or drop scheduled runs). Still before Central midnight in daylight
    # and standard time. It does nothing when the 03:15 run already captured the day (--skip-if-captured below).
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also rebuild missing days of the last N days (the schedule uses 7; 91 fills a whole archive)"
        default: "7"
      date:
        description: "Report day to capture, YYYY-MM-DD in Central time; empty means today. Use it to repair a day that was missed or captured too early"
        default: ""
      oklahoma_history:
        description: "Also rebuild Oklahoma's whole 92-day archive from the OCC's master files (reads 230 MB; about 2 minutes). Use it to refill the archive"
        type: boolean
        default: false
      new_mexico_history:
        description: "Also rebuild New Mexico's whole 92-day archive from the OCD's well layer (two requests). Use it to refill the archive"
        type: boolean
        default: false

concurrency:
  group: daily-rrc-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # poppler draws page one of the PDFs and Pillow builds the contact sheets of the image packs (d7_packs.py). Without
      # them the packs are still counted and the capture does not fail, so a hiccup here costs the previews and nothing else.
      - name: Install the tools that draw page previews
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          python3 -m pip install --quiet pillow

      # --publish-docs also publishes the day's W-1 letters, plats and directional surveys, readable and unmodified, as the files of
      # one GitHub release (tag daily-YYYY-MM-DD, pre-release) that each drill's page links to, and removes the releases of days
      # that have left the 92-day archive. GH_TOKEN is what lets the gh CLI do that (contents: write, above). See the README
      # (Privacy) for why this is a deliberate choice; delete the flag to go back to blurred contact sheets only.
      # continue-on-error: the RRC has refused GitHub's runners for whole afternoons (HTTP 403 and dropped TLS handshakes from every
      # share), which fails this step after about five minutes of retries. That must not stop the Oklahoma capture, the commit or
      # the publish: the steps below put the Texas folder back as committed and the last step turns the run red.
      - name: Capture the report
        id: tx_capture
        continue-on-error: true
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '7' }}
          REPORT_DATE: ${{ github.event.inputs.date }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BACKFILL" in ''|*[!0-9]*) echo "backfill must be a whole number"; exit 1;; esac
          args=(--backfill "$BACKFILL" --packs --publish-docs)
          if [ -n "$REPORT_DATE" ]; then
            case "$REPORT_DATE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args+=(--date "$REPORT_DATE") ;;
              *) echo "date must look like 2026-10-30"; exit 1 ;;
            esac
          fi
          # a scheduled run is needed once a day: the backup stands down when the evening run already did the job
          if [ "$EVENT" = "schedule" ]; then args+=(--skip-if-captured); fi
          python3 -I site/pipeline/d7_daily.py "${args[@]}"

      # Oklahoma's files are small and the capture takes seconds (the history option reads the 230 MB master files). Nothing in
      # this step can stop the job: the check below decides whether what it wrote is fit to commit.
      - name: Capture the Oklahoma report
        id: ok_capture
        continue-on-error: true
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '7' }}
          REPORT_DATE: ${{ github.event.inputs.date }}
          OK_HISTORY: ${{ github.event.inputs.oklahoma_history }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$BACKFILL" in ''|*[!0-9]*) echo "backfill must be a whole number"; exit 1;; esac
          args=(--backfill "$BACKFILL")
          if [ -n "$REPORT_DATE" ]; then
            case "$REPORT_DATE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args+=(--date "$REPORT_DATE") ;;
              *) echo "date must look like 2026-10-30"; exit 1 ;;
            esac
          fi
          if [ "$OK_HISTORY" = "true" ]; then args+=(--history); fi
          # the backup schedule stands down when the evening run already did the job
          if [ "$EVENT" = "schedule" ]; then args+=(--skip-if-captured); fi
          python3 -I site/pipeline/d8_ok_daily.py "${args[@]}"

      # New Mexico's permits come from the Division's well layer in two requests; nothing in this step can stop the job either.
      - name: Capture the New Mexico report
        id: nm_capture
        continue-on-error: true
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '7' }}
          REPORT_DATE: ${{ github.event.inputs.date }}
          NM_HISTORY: ${{ github.event.inputs.new_mexico_history }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$BACKFILL" in ''|*[!0-9]*) echo "backfill must be a whole number"; exit 1;; esac
          args=(--backfill "$BACKFILL")
          if [ -n "$REPORT_DATE" ]; then
            case "$REPORT_DATE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args+=(--date "$REPORT_DATE") ;;
              *) echo "date must look like 2026-10-30"; exit 1 ;;
            esac
          fi
          if [ "$NM_HISTORY" = "true" ]; then args+=(--history); fi
          # the backup schedule stands down when the evening run already did the job
          if [ "$EVENT" = "schedule" ]; then args+=(--skip-if-captured); fi
          python3 -I site/pipeline/d9_nm_daily.py "${args[@]}"

      - name: Check the archive
        id: tx_check
        continue-on-error: true
        run: python3 -I site/pipeline/d7_daily.py --check

      # A failed capture or a failed check must not put Texas data on main either (a failed capture still rewrites index.json
      # with a new `generated` time): put the folder back as it was committed.
      - name: Drop the Texas changes if the capture or its check failed
        if: ${{ steps.tx_capture.outcome == 'failure' || steps.tx_check.outcome == 'failure' }}
        run: |
          echo "::warning title=Texas report::the Texas capture or its check failed; its changes are not committed. The Oklahoma report goes ahead."
          git checkout -- site/public/data/daily
          git clean -fdq -- site/public/data/daily

      # A failed capture or a failed check must not put Oklahoma data on main: put the folder back as it was committed.
      - name: Check the Oklahoma archive
        id: ok_check
        continue-on-error: true
        run: python3 -I site/pipeline/d8_ok_daily.py --check

      - name: Drop the Oklahoma changes if the capture or its check failed
        if: ${{ steps.ok_capture.outcome == 'failure' || steps.ok_check.outcome == 'failure' }}
        run: |
          echo "::warning title=Oklahoma report::the Oklahoma capture or its check failed; its changes are not committed. The Texas report goes ahead."
          git checkout -- site/public/data/daily-ok
          git clean -fdq -- site/public/data/daily-ok

      # A failed capture or a failed check must not put New Mexico data on main: put the folder back as it was committed.
      - name: Check the New Mexico archive
        id: nm_check
        continue-on-error: true
        run: python3 -I site/pipeline/d9_nm_daily.py --check

      - name: Drop the New Mexico changes if the capture or its check failed
        if: ${{ steps.nm_capture.outcome == 'failure' || steps.nm_check.outcome == 'failure' }}
        run: |
          echo "::warning title=New Mexico report::the New Mexico capture or its check failed; its changes are not committed. The other reports go ahead."
          git checkout -- site/public/data/daily-nm
          git clean -fdq -- site/public/data/daily-nm

      - name: Commit the new files
        run: |
          git config user.name "daily-rrc-report"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data/daily site/public/data/daily-ok site/public/data/daily-nm
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          # title it with the day the report is for (Central time), which is the newest day file of any state; the run's own
          # UTC date is already tomorrow when the 03:15 UTC job captures the previous evening
          report="$(ls site/public/data/daily site/public/data/daily-ok site/public/data/daily-nm | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1)"
          report="${report%.json}"
          git commit -m "Daily RRC, OCC and OCD reports ${report:-$(date -u +%F)}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # The live site is the gh-pages branch: a copy of the committed site/public plus the .nojekyll marker that stops
      # Pages from running Jekyll. A plain push, never a force push, so the branch keeps its history. The same script publishes
      # after a green merge (publish.yml); if the two push at once, the one refused starts again from the branch's new tip.
      - name: Publish the site to GitHub Pages
        run: bash .github/scripts/publish_pages.sh

      # The captures above carry on after an error so that what worked is committed and published; this is where the run still
      # fails, so a night on which the RRC or the OCC could not be read shows red in the Actions list and in GitHub's e-mail.
      - name: Fail the run if a capture or a check failed
        if: ${{ !cancelled() && (steps.tx_capture.outcome == 'failure' || steps.tx_check.outcome == 'failure' || steps.ok_capture.outcome == 'failure' || steps.ok_check.outcome == 'failure' || steps.nm_capture.outcome == 'failure' || steps.nm_check.outcome == 'failure') }}
        run: |
          echo "::error title=Daily reports::Texas capture ${{ steps.tx_capture.outcome }}, Texas check ${{ steps.tx_check.outcome }}, Oklahoma capture ${{ steps.ok_capture.outcome }}, Oklahoma check ${{ steps.ok_check.outcome }}, New Mexico capture ${{ steps.nm_capture.outcome }}, New Mexico check ${{ steps.nm_check.outcome }}. What succeeded was committed and published; what failed was left as committed."
          exit 1
