# Captures the Railroad Commission's nightly files into site/public/data/daily/, commits the result, then publishes
# the site to GitHub Pages (the gh-pages branch). It runs from the default branch only.
name: Daily RRC report

on:
  schedule:
    # 03:15 UTC = 10:15 PM CDT / 9:15 PM CST: after the RRC's evening files are out, still the same Central-time day
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also rebuild missing days of the last N days (the schedule uses 7; 91 fills a whole archive)"
        default: "7"

concurrency:
  group: daily-rrc-report
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture the report
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '7' }}
        run: |
          case "$BACKFILL" in ''|*[!0-9]*) echo "backfill must be a whole number"; exit 1;; esac
          python3 -I site/pipeline/d7_daily.py --backfill "$BACKFILL"

      - name: Check the archive
        run: python3 -I site/pipeline/d7_daily.py --check

      - name: Commit the new files
        run: |
          git config user.name "daily-rrc-report"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data/daily
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Daily RRC report $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # The live site is the gh-pages branch: a copy of the committed site/public plus the .nojekyll marker that stops
      # Pages from running Jekyll. A plain push, never a force push, so the branch keeps its history.
      - name: Publish the site to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$(git rev-parse --short HEAD)"
          dest="$RUNNER_TEMP/pages"
          git fetch origin gh-pages
          git worktree add -B gh-pages "$dest" origin/gh-pages
          find "$dest" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive HEAD site/public | tar -x --strip-components=2 -C "$dest"
          touch "$dest/.nojekyll"
          # a publish replaces the whole site, so refuse to go on if the copy is not a site
          test -s "$dest/index.html" && test -s "$dest/js/main.js" && test -s "$dest/data/meta.json" \
            || { echo "the copy of site/public is incomplete; not publishing"; exit 1; }
          cd "$dest"
          git add -A
          if git diff --cached --quiet; then echo "the published site is already current"; exit 0; fi
          git commit -m "Publish the site (from $src)"
          git push origin HEAD:gh-pages
          # a push made with the workflow's own token may not start a Pages build, so ask for one (harmless if one ran)
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null \
            || echo "::warning::could not request a Pages build; the push itself may still publish the site"
